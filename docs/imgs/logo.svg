<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="200" cy="200" r="190" fill="url(#blueGradient)" />

  <!-- Inner circle for depth -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Large P -->
  <path d="M 120 100 L 180 100 Q 260 100 260 170 Q 260 240 180 240 L 150 240 L 150 300 L 120 300 Z M 150 130 L 150 210 L 180 210 Q 230 210 230 170 Q 230 130 180 130 Z"
        fill="white"
        stroke="white"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Accent dot (pouch clasp) -->
  <circle cx="280" cy="120" r="16" fill="white" opacity="0.9" />
  <circle cx="280" cy="120" r="8" fill="#2563eb" />
</svg>
