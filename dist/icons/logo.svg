<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGradient)" />

  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Large P -->
  <path d="M 60 50 L 90 50 Q 130 50 130 85 Q 130 120 90 120 L 75 120 L 75 150 L 60 150 Z M 75 65 L 75 105 L 90 105 Q 115 105 115 85 Q 115 65 90 65 Z"
        fill="white"
        stroke="white"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Accent dot (pouch clasp) -->
  <circle cx="140" cy="60" r="8" fill="white" opacity="0.9" />
  <circle cx="140" cy="60" r="4" fill="#2563eb" />
</svg>
